[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-chatbot-rag"
version = "0.1.0"
description = "A small FastAPI and LangGraph backend for PDF question answering"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "langgraph>=1,<2",
    "openai>=2,<3",
    "pydantic-settings>=2.8,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
